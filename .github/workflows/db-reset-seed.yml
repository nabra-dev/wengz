name: Reset DB and Seed

# Dangerous: wipes the VPS Postgres database and reseeds from prisma/seed.ts.
# Run only via workflow_dispatch after confirming the target.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to wipe production DB and reseed'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  reset-and-seed:
    name: Wipe VPS DB and seed
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'RESET'
    timeout-minutes: 30
    steps:
      - name: Reset database and seed over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          protocol: tcp
          timeout: 60s
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/var/www/nabra-ai-system}"
            cd "$APP_DIR"

            if [[ ! -f .env ]]; then
              echo "ERROR: missing $APP_DIR/.env"
              exit 1
            fi

            echo "Syncing code to origin/main…"
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main

            export NODE_ENV=production
            export HUSKY=0
            set -a
            # shellcheck disable=SC1091
            source .env
            set +a

            if [[ -z "${SEED_ADMIN_PASSWORD:-}" ]]; then
              echo "ERROR: SEED_ADMIN_PASSWORD must be set in VPS .env"
              exit 1
            fi

            echo "Force-resetting Prisma schema (ALL DATA WILL BE LOST)…"
            npx prisma db push --force-reset --accept-data-loss

            echo "Seeding…"
            npm run db:seed

            if command -v redis-cli >/dev/null 2>&1; then
              redis-cli FLUSHDB || true
            fi

            pm2 restart nabra-ai-system --update-env || pm2 restart all
            echo "Done. Production DB reset and seeded."
