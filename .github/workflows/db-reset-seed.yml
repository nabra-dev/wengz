name: Reset DB and Seed (safe)

# Preserves PENDING users. Backs up DB, force-resets, seeds, restores PENDING,
# verifies, then reopens. See scripts/prod-safe-reset-seed.ts and docs/DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESET to wipe non-pending production data and reseed"
        required: true
        type: string
      confirm_phrase:
        description: "Type KEEP_PENDING to confirm PENDING users will be preserved"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  reset-and-seed:
    name: Safe wipe VPS DB and seed
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.confirm == 'RESET' &&
      github.event.inputs.confirm_phrase == 'KEEP_PENDING'
    timeout-minutes: 45
    steps:
      - name: Safe reset over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          protocol: tcp
          timeout: 60s
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/var/www/nabra-ai-system}"
            cd "$APP_DIR"

            if [[ ! -f .env ]]; then
              echo "ERROR: missing $APP_DIR/.env"
              exit 1
            fi

            echo "Syncing code to origin/main…"
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main

            export NODE_ENV=production
            export HUSKY=0
            export APP_DIR
            set -a
            # shellcheck disable=SC1091
            source .env
            set +a

            export CONFIRM_PROD_RESET=RESET
            export KEEP_PENDING_MODE=1

            echo "Running safe reset (passwords are NOT printed)…"
            npm run db:safe-reset

            echo "Done. Check /var/backups/nabra/<timestamp>/credentials.txt on the VPS for new passwords."
