name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Fast gate only — production build runs once on the VPS.
  ci:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      NEXTAUTH_URL: https://wengz.tech
      NEXTAUTH_SECRET: ci-build-placeholder-not-a-real-secret
      NEXT_PUBLIC_APP_URL: https://wengz.tech
      NEXT_PUBLIC_GTM_ID: GTM-58DDFXLX
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

  deploy:
    name: Deploy to Hostinger VPS
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 40
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          protocol: tcp
          timeout: 60s
          script_stop: true
          command_timeout: 35m
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH=main
            if ! /usr/local/bin/deploy-nabra.sh; then
              echo "=== deploy failed — last 80 lines of /var/log/nabra-deploy.log ==="
              tail -n 80 /var/log/nabra-deploy.log || true
              exit 1
            fi
